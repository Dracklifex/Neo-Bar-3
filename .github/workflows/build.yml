{
  "name": "Build APK",
  "on": {
    "push": {
      "branches": ["main", "master"]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "${{ github.repository }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Preparar proyecto",
          "run": "shopt -s nullglob\nfor z in *.zip; do unzip -oq \"$z\"; done\nif [ -d NeoBar ]; then echo \"PROJ=NeoBar\" >> \"$GITHUB_ENV\"; else echo \"PROJ=.\" >> \"$GITHUB_ENV\"; fi\necho \"Proyecto en: $(grep PROJ \"$GITHUB_ENV\")\"\nls"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "gradle/actions/setup-gradle@v4",
          "with": {
            "gradle-version": "8.7"
          }
        },
        {
          "name": "Compilar APK debug",
          "working-directory": "${{ env.PROJ }}",
          "run": "gradle assembleDebug --no-daemon"
        },
        {
          "name": "Publicar en Releases",
          "run": "cp \"$PROJ/app/build/outputs/apk/debug/app-debug.apk\" NeoBar.apk\ngh release delete latest --yes --cleanup-tag || true\ngh release create latest NeoBar.apk --target \"$GITHUB_SHA\" --title NeoBar --notes \"APK de depuracion\""
        }
      ]
    }
  }
}
